services:
  app:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    working_dir: /var/www/html
    volumes:
      - ..:/var/www/html
    env_file:
      - ../.env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
    depends_on:
      - postgres
    restart: unless-stopped

  node:
    image: node:22-alpine
    working_dir: /var/www/html
    volumes:
      - ..:/var/www/html
    command: sh -c "npm ci && npm run build"
    profiles: ["build"]

  nginx:
    image: nginx:alpine
    volumes:
      - ..:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - app
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lms
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

volumes:
  postgres_data:
